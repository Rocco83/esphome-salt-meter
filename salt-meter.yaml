# Salt level in the water softener's brine tank: an ESP32-C6 with a DFRobot
# A02YYUW waterproof ultrasonic sensor looking down from the lid. The sensor
# measures the distance to the salt surface; the firmware turns it into the
# salt height above the tank bottom (0 cm = empty) and a percentage.
# Wired directly to the DevKit, no breakout PCB: hardware and wiring in README.md

substitutions:
  friendly_name: "Salt Meter"

  # Defaults for the tank geometry, all changeable from HA (stored in flash).
  # Distance from the sensor face to the tank bottom: 49 cm on the old meter.
  empty_distance_default: "49"
  # Distance from the sensor face at which the tank counts as full. The
  # A02YYUW cannot see closer than 3 cm (blind zone), so anything below 3
  # can never read 100 %.
  full_distance_default: "0"
  # The A02YYUW measures from its transducer face, which sits inside the
  # module: a target 50 cm from the module's face reads 48 cm. Added to
  # every distance. Measured 2026-11-05, checked every 10 cm.
  sensor_offset_default: "2.0"

  # Sensor UART RX on the ESP32 (sensor TX, white wire). Not strapping,
  # not USB-JTAG, not UART0.
  sensor_rx_pin: GPIO6

  # No valid frame from the sensor for this long = sensor offline
  sensor_timeout_ms: "10000"

  # How often the level reaches HA, and how often the frame summary is
  # logged. 5s while calibrating; 60s in production (BACKLOG.md #1).
  publish_interval: 5s
  frame_summary_interval: 5s

esphome:
  name: salt-meter
  friendly_name: ${friendly_name}
  # built and tested on this release: refuse an older ESPHome
  min_version: 2026.10.2
  on_boot:
    # the running slot cannot change while running: read it once
    - priority: -100
      then:
        - component.update: ota_partition

# Throttle writing parameters to the internal flash memory to reduce ESP memory wear / degradation
# (the geometry numbers)
preferences:
  flash_write_interval: 15min

# Back to safe mode (OTA only) after repeated boot failures
safe_mode:
  boot_is_good_after: 1min
  num_attempts: 10


#########################
# ESP32 AND NETWORK SETUP

esp32:
  # ESP32-C6FH4: 4 MB flash embedded in the chip
  board: esp32-c6-devkitm-1
  framework:
    type: esp-idf

# Console on the native USB-Serial-JTAG port (the C6 default, GPIO12/13): one
# USB cable gives logs and flashing. UART0 (GPIO16/17) stays free.
logger:
  level: DEBUG
  logs:
    # the A02YYUW sends ~10 frames a second, keep the raw sensor quiet
    sensor: INFO
    # its per-frame "Invalid data" warning (every 0 / <=30 mm frame): the
    # frame_summary interval reports those instead. Checksum errors are
    # counted there too.
    a02yyuw.sensor: ERROR

# default HA integration, OTA updater and backup http web portal
api:
  # measuring is standalone: don't reboot when Home Assistant is away
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  # Read the wifi/pass from secrets.yaml and support 2 SSID.
  # Roaming to a better AP is post_connect_roaming (on by default).
  networks:
    - ssid: !secret wifi_1_ssid
      password: !secret wifi_1_password
    - ssid: !secret wifi_2_ssid
      password: !secret wifi_2_password

# Web server for local diagnostics
web_server:
  port: 80
  version: 3

debug:
  update_interval: 60s

time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Rome"
    # No servers defined = use DHCP provided servers


#########################
# SALT LEVEL

# A02YYUW: 9600 8N1, the sensor only talks. Its RX (yellow wire) is left
# unconnected: internal pull-up = "processed" mode, filtered output ~every 100 ms.
uart:
  id: uart_sensor
  rx_pin: ${sensor_rx_pin}
  baud_rate: 9600
  # Calibration aid (BACKLOG.md #2): log every byte as it arrives, one
  # line per frame (4 bytes take ~4 ms, frames come ~100 ms apart), and
  # classify the frames for the frame_summary interval.
  debug:
    direction: RX
    after:
      timeout: 20ms
    sequence:
      - lambda: |-
          // A chunk that is not exactly one frame: dump it raw as well
          if (bytes.size() != 4 || bytes[0] != 0xFF)
            UARTDebug::log_hex(direction, bytes, ':');
          for (size_t i = 0; i + 4 <= bytes.size(); ) {
            if (bytes[i] != 0xFF) { i++; continue; }
            uint8_t sum = bytes[i] + bytes[i + 1] + bytes[i + 2];
            uint16_t mm = (bytes[i + 1] << 8) | bytes[i + 2];
            const char *note = "";
            id(fr_total)++;
            if (sum != bytes[i + 3]) {
              id(fr_checksum)++;
              note = "  CHECKSUM ERROR";
            } else if (mm == 0) {
              id(fr_zero)++;
              note = "  (closer than 3 cm or no echo)";
            } else if (mm <= 30) {
              id(fr_blind)++;
              note = "  (blind zone)";
            }
            ESP_LOGD("uart_debug", "<<< %02X:%02X:%02X:%02X - %.1f cm%s",
                     bytes[i], bytes[i + 1], bytes[i + 2], bytes[i + 3], mm / 10.0f, note);
            if (!*note) {
              id(fr_valid)++;
              id(fr_sum_mm) += mm;
              if (mm < id(fr_min_mm)) id(fr_min_mm) = mm;
              if (mm > id(fr_max_mm)) id(fr_max_mm) = mm;
            }
            i += 4;
          }

globals:
  # millis() of the last valid frame, for the "Sensor" connectivity entity
  - id: last_frame_ms
    type: uint32_t
    initial_value: "0"
  # frame counters since the last frame_summary, reset by it
  - id: fr_total
    type: uint32_t
  - id: fr_valid
    type: uint32_t
  - id: fr_zero
    type: uint32_t
  - id: fr_blind
    type: uint32_t
  - id: fr_checksum
    type: uint32_t
  - id: fr_sum_mm
    type: uint32_t
  - id: fr_min_mm
    type: uint16_t
    initial_value: "0xFFFF"
  - id: fr_max_mm
    type: uint16_t

# One line per frame_summary_interval: what the sensor sent in that window.
# 0 mm is the A02YYUW's "no measurement": target closer than 3 cm, or no
# echo at all (beam tilted, soft or absorbing surface, out of range).
interval:
  - interval: ${frame_summary_interval}
    then:
      - lambda: |-
          static const char *const TAG = "frames";
          if (id(fr_total) == 0) {
            ESP_LOGW(TAG, "no frames from the sensor (wiring / power?)");
          } else {
            if (id(fr_valid) > 0) {
              ESP_LOGI(TAG, "%u frames: %u valid, avg %.1f cm (min %.1f, max %.1f)",
                       id(fr_total), id(fr_valid),
                       id(fr_sum_mm) / 10.0f / id(fr_valid),
                       id(fr_min_mm) / 10.0f, id(fr_max_mm) / 10.0f);
            } else {
              ESP_LOGI(TAG, "%u frames: none valid", id(fr_total));
            }
            if (id(fr_zero) > 0)
              ESP_LOGW(TAG, "  %u x 0 mm: closer than 3 cm or no echo", id(fr_zero));
            if (id(fr_blind) > 0)
              ESP_LOGW(TAG, "  %u x 1-30 mm: in the 3 cm blind zone", id(fr_blind));
            if (id(fr_checksum) > 0)
              ESP_LOGW(TAG, "  %u x checksum error (noise on the line?)", id(fr_checksum));
          }
          id(fr_total) = id(fr_valid) = id(fr_zero) = id(fr_blind) = id(fr_checksum) = 0;
          id(fr_sum_mm) = 0;
          id(fr_min_mm) = 0xFFFF;
          id(fr_max_mm) = 0;

number:
  - platform: template
    name: "Offset Sensore"
    id: sensor_offset
    icon: mdi:ruler
    entity_category: config
    unit_of_measurement: "cm"
    mode: box
    min_value: -10
    max_value: 10
    step: 0.1
    initial_value: ${sensor_offset_default}
    optimistic: true
    restore_value: true

  - platform: template
    name: "Distanza Fondo"
    id: empty_distance
    icon: mdi:arrow-collapse-down
    entity_category: config
    unit_of_measurement: "cm"
    mode: box
    min_value: 5
    max_value: 200
    step: 0.5
    initial_value: ${empty_distance_default}
    optimistic: true
    restore_value: true
    on_value:
      then:
        - component.update: salt_level_percent

  - platform: template
    name: "Distanza Pieno"
    id: full_distance
    icon: mdi:arrow-collapse-up
    entity_category: config
    unit_of_measurement: "cm"
    mode: box
    min_value: 0
    max_value: 100
    step: 0.5
    initial_value: ${full_distance_default}
    optimistic: true
    restore_value: true
    on_value:
      then:
        - component.update: salt_level_percent

sensor:
  # Raw frames, one every ~100 ms. Internal: HA gets the filtered copies.
  # The component drops checksum errors and readings <= 30 mm (blind zone).
  - platform: a02yyuw
    id: raw_distance
    uart_id: uart_sensor
    internal: true
    on_raw_value:
      then:
        - lambda: id(last_frame_ms) = millis();

  # Distance from the sensor face, for calibration: put the sensor in the
  # empty tank and copy this into "Distanza Fondo" (or press "Calibra Fondo").
  - platform: copy
    source_id: raw_distance
    name: "Distanza Sensore"
    id: distance_cm
    entity_category: diagnostic
    unit_of_measurement: "cm"
    device_class: distance
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      # Salt surface echoes are noisy: the median of ~2.5 s of frames drops spikes
      - median:
          window_size: 25
          send_every: 25
          send_first_at: 5
      # Salt goes down over days: one value per minute is plenty in
      # production (publish_interval, BACKLOG.md #1)
      - throttle_average: ${publish_interval}
      # distance from the module's face, not from the transducer inside it
      - lambda: return x + id(sensor_offset).state;

  # Salt height above the bottom: 0 = empty, "Distanza Fondo" - "Distanza Pieno" = full
  - platform: copy
    source_id: distance_cm
    name: "Sale Rimanente - cm"
    id: salt_meter
    icon: mdi:shaker-outline
    unit_of_measurement: "cm"
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          float h = id(empty_distance).state - x;
          return clamp(h, 0.0f, id(empty_distance).state - id(full_distance).state);
    on_value:
      then:
        - component.update: salt_level_percent

  - platform: template
    name: "Sale Rimanente - %"
    id: salt_level_percent
    unit_of_measurement: "%"
    state_class: measurement
    icon: mdi:shaker-outline
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      float span = id(empty_distance).state - id(full_distance).state;
      if (isnan(id(salt_meter).state) || span <= 0) return {};
      return clamp(id(salt_meter).state / span * 100.0f, 0.0f, 100.0f);

  #########################
  # DIAGNOSTICS

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 60s

  - platform: wifi_signal
    name: "WiFi Signal"
    entity_category: diagnostic
    update_interval: 60s

  - platform: debug
    free:
      name: "Free Memory"
      entity_category: diagnostic

  - platform: internal_temperature
    name: "Chip Temperature"
    entity_category: diagnostic
    update_interval: 60s

binary_sensor:
  # off = no valid frame for sensor_timeout_ms: cable, power or sensor fault.
  # While off, the level entities keep their last value.
  - platform: template
    name: "Sensor"
    id: sensor_online
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(last_frame_ms) != 0 && millis() - id(last_frame_ms) < ${sensor_timeout_ms};

button:
  # Set "Distanza Fondo" to the current distance. Press with the tank empty
  # (or with the salt level known and adjust by hand afterwards).
  - platform: template
    name: "Calibra Fondo"
    icon: mdi:target
    entity_category: config
    on_press:
      then:
        - if:
            condition:
              lambda: return !isnan(id(distance_cm).state);
            then:
              - number.set:
                  id: empty_distance
                  value: !lambda return roundf(id(distance_cm).state * 2.0f) / 2.0f;
              - logger.log:
                  format: "Distanza Fondo set to %.1f cm"
                  args: [id(empty_distance).state]
            else:
              - logger.log:
                  level: WARN
                  format: "Calibra Fondo: no distance reading yet"

  # A template button, not platform: restart - that one reboots inside its
  # press action, so its on_press would never run.
  - platform: template
    name: "ESPHome Restart"
    id: btn_restart
    entity_category: config
    icon: mdi:restart
    on_press:
      then:
        # a manual restart is not a failed boot: don't let safe_mode count it
        - lambda: |-
            esp_ota_mark_app_valid_cancel_rollback();
            ESP_LOGI("boot", "OTA marked valid before reboot");
        - delay: 200ms
        - lambda: App.safe_reboot();

  - platform: template
    name: "Clear Stored States"
    icon: mdi:database-remove
    entity_category: config
    on_press:
      then:
        - lambda: |-
            global_preferences->reset();
            ESP_LOGI("custom", "NVM Memory Cleared! Restarting...");
        - delay: 1s
        # call the restart button, to consolidate the logic
        - button.press: btn_restart

text_sensor:
  - platform: version
    name: "ESPHome Version"
    icon: mdi:information
    entity_category: diagnostic
    hide_timestamp: true

  # why the last reboot happened (power-on, watchdog, brownout, software...)
  - platform: debug
    reset_reason:
      name: "Reset Reason"

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic

  # Running OTA slot. update_interval never: only the on_boot trigger runs it.
  # The nullptr guard is required (invalid otadata / flash read error).
  - platform: template
    name: "OTA Partition"
    id: ota_partition
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      const esp_partition_t *p = esp_ota_get_running_partition();
      return p ? std::string(p->label) : std::string("unknown");
