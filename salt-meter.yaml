substitutions:
  friendly_name: "Salt Meter"

esphome:
  name: salt-meter

# Throttle writing parameters to the internal flash memory to reduce ESP memory wear / degradation
preferences:
  flash_write_interval: 15min


#########################
# ESP32 AND NETWORK SETUP

esp32:
  board: nodemcu-32s
  framework:
    type: esp-idf

# Enable logging via UART
logger:
  level: DEBUG
  #logs:
    # component includes the custom component, which file the error "Components should block for at most 20-30ms."
    # https://github.com/esphome/issues/issues/4717
    #component: ERROR

# default HA integration, OTA updater and backup http web portal
api:
  # TODO increase the security
  # password: !secret device_password
  #encryption:
  #  key: "YOUR_ENCRYPTION_KEY"
  # 5m default delay. if no home assistant, then force reboot
  reboot_timeout: 0s

ota:
  - platform: esphome
  # TODO increase the security
  # password: !secret device_password
  # change to https://esphome.io/components/ota/http_request ?

wifi:
  # Read the wifi/pass from secrets.yaml and support 2 SSID
  networks:
  - ssid: !secret wifi_1_ssid
    password: !secret wifi_1_password
  - ssid: !secret wifi_2_ssid
    password: !secret wifi_2_password

web_server:
  port: 80
  version: 3

text_sensor:
  - platform: version
    name: "ESPHome Version"
    icon: mdi:information
    hide_timestamp: true
  # Send Uptime in raw seconds
  - platform: template
    name: "Uptime"
    id: uptime_human
    icon: mdi:clock-start
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    mac_address:
      name: "MAC Address"
  - platform: template
    name: "Hostname"
    id: kl_hostname_ts
    icon: mdi:network
    entity_category: "diagnostic"
    update_interval: 60s
    # framework esp-idf dependant
    lambda: |-
      const char *hostname;
      esp_netif_get_hostname(esp_netif_get_handle_from_ifkey("WIFI_STA_DEF"), &hostname);
      return std::string(hostname);

sensor:
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s # Check every minute
    entity_category: "diagnostic"
    filters:
      - sliding_window_moving_average: # Smooth out data to prevent false triggers
          window_size: 3
          send_every: 1
    on_value:
      then:
        - if:
            condition:
              and:
                - wifi.connected:
                - lambda: 'return x < -80;' # Trigger if signal is worse than -80dB
            then:
              - logger.log: "WiFi Signal is below -80dB. Forcing scan for better BSSID..."
              # There is no "roam" command, so we toggle WiFi to force a new scan/connect
              - wifi.disable:
              - delay: 2s
              - wifi.enable:


  # This is a bit of overkill. It sends a human readable
  # uptime string 1h 41m 32s instead of 6092 seconds
  - platform: uptime
    name: "${friendly_name} Uptime"
    id: uptime_sensor
    update_interval: 60s
    on_raw_value:
      then:
        - text_sensor.template.publish:
            id: uptime_human
            # Custom C++ code to generate the result
            state: !lambda |-
              int seconds = round(id(uptime_sensor).raw_state);
              int days = seconds / (24 * 3600);
              seconds = seconds % (24 * 3600);
              int hours = seconds / 3600;
              seconds = seconds % 3600;
              int minutes = seconds /  60;
              seconds = seconds % 60;
              return (
                (days ? to_string(days) + "d " : "") +
                (hours ? to_string(hours) + "h " : "") +
                (minutes ? to_string(minutes) + "m " : "") +
                (to_string(seconds) + "s")
              ).c_str();

  # Read the level of the salt
  - platform: ultrasonic
    id: salt_meter
    trigger_pin: GPIO32
    echo_pin: GPIO12
    name: "Ultrasonic Sensor"
    update_interval: 5s
    accuracy_decimals: 0
    unit_of_measurement: "cm"
    filters:
      # Convert meters to cm
      - multiply: 100

      # 1. Remove outliers (spikes) using a median filter
      # calculate the median, take in account 20 values, send it out every 10 of it
      - median:
          window_size: 20
          send_every: 10
          send_first_at: 3

      # 2. Smooth the line using a moving average
      # This averages the last 15 values to keep the line "straight"
      - sliding_window_moving_average:
          window_size: 15
          send_every: 1

      # 3. Ensure the final output is rounded to the nearest integer
      - lambda: return round(x);

button:
  - platform: restart
    name: "ESPHome Restart"
    entity_category: "config"
  - platform: template
    name: "Clear Stored States"
    id: clear_states_button
    icon: "mdi:database-remove"
    entity_category: "config"
    on_press:
      then:
        - lambda: |-
            global_preferences->reset();
            ESP_LOGI("custom", "NVM Memory Cleared! Restarting...");
        - delay: 1s
        # This is the correct way to reboot via code
        - lambda: 'App.safe_reboot();'

time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Rome"
    # No servers defined = use DHCP provided servers

